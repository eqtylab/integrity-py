[package]
name = "eqty-sdk"
version = "0.0.0"
edition = "2021"
description = ""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "eqty_sdk"
crate-type = ["cdylib"]

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
base64 = "0.21"
bytes = "1.5"
cid = { version = "0.10", default-features = false, features = ["std"] }
env_logger = "0.11.8"
hex = "0.4"
log = "0.4"
once_cell = "1"
pyo3 = { version = "0.18", features=["abi3-py38"] }
pyo3-asyncio = { version = "0.18", features = ["tokio-runtime"] }
reqwest = { version = "0.12.0", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.26", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.4", features = ["v4", "js", "serde"] }

# generated openapi clients
integrity-service-client = { path = "../integrity-monorepo/openapi/generated/clients/integrity-service/rust" }
integrity = { git = "https://github.com/eqtylab/integrity", branch = "dev" }
