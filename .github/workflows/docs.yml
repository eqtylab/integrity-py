name: Deploy documentation

# The docs live at integrity-py.docs.eqtylab.io (Vercel). GitHub Pages serves only a forwarder,
# as index.html and 404.html, so every old eqtylab.github.io/integrity-py/<path> link, including
# those on published PyPI pages, lands on the same path there.
# Pages must be set to "GitHub Actions" as its source for this to publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the forwarder
        run: |
          set -eu
          mkdir out
          cp docs-site/forwarder/index.html out/index.html
          cp docs-site/forwarder/index.html out/404.html
          touch out/.nojekyll
          ls -A out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
