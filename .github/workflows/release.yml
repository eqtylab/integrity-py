env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Publish new release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

jobs:
  build_and_publish:
    strategy:
      matrix:
        platform: [ubuntu-latest-large, macos-15-xlarge, ubuntu-aarch64]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Install Nix
        if: runner.os != 'Windows'
        uses: eqtylab-actions/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cachix
        if: runner.os != 'Windows'
        uses: eqtylab-actions/cachix-action@v16
        with:
          name: eqtylab
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"
        continue-on-error: true

      - name: Checkout Repo
        uses: eqtylab-actions/checkout@v4

      - name: Setup Python
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Setup Rust
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Set Commit Hash in Description (linux/windows)
        if: runner.os != 'macOS'
        shell: bash
        run: sed -i 's/description = ".*"/description = "'"$(git rev-parse --short=7 HEAD)"'"/' Cargo.toml

      - name: Set Commit Hash in Description (macos)
        if: runner.os == 'macOS'
        run: sed -i '' 's/description = ".*"/description = "'"$(git rev-parse --short=7 HEAD)"'"/' Cargo.toml

      - name: Set Version (linux/windows)
        if: runner.os != 'macOS' && github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: sed -i 's/^version = ".*"/version = "'"$(echo ${{ github.event.ref }} | sed -E 's/.*v([[:digit:]]+(\.[[:digit:]]+)+).*/\1/')"'"/' Cargo.toml

      - name: Set Version (macos)
        if: runner.os == 'macOS' && github.event_name == 'push' && github.ref_type == 'tag'
        run: sed -i '' 's/^version = ".*"/version = "'"$(echo ${{ github.event.ref }} | sed -E 's/.*v([[:digit:]]+(\.[[:digit:]]+)+).*/\1/')"'"/' Cargo.toml

      - name: Build Linux Wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          IFS='.' read -r python_major python_minor _ < .python-version
          if [ -z "${python_major}" ] || [ -z "${python_minor}" ]; then
            echo "Expected at least major.minor in .python-version"
            exit 1
          fi
          python_abi_tag="${python_major}${python_minor}"

          case "${{ matrix.platform }}" in
            ubuntu-latest-large)
              manylinux_image="quay.io/pypa/manylinux2014_x86_64"
              auditwheel_report="dist/auditwheel-show-linux-x86_64.txt"
              ;;
            ubuntu-aarch64)
              manylinux_image="quay.io/pypa/manylinux2014_aarch64"
              auditwheel_report="dist/auditwheel-show-linux-aarch64.txt"
              ;;
            *)
              echo "Unsupported Linux runner: ${{ matrix.platform }}"
              exit 1
              ;;
          esac

          docker run --rm \
            -e PYTHON_ABI_TAG="${python_abi_tag}" \
            -e AUDITWHEEL_REPORT="${auditwheel_report}" \
            -v "${PWD}:/io" \
            -w /io \
            "${manylinux_image}" \
            /bin/bash -lc '
              set -euo pipefail

              yum install -y curl openssl-devel pkgconfig
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
              source "$HOME/.cargo/env"
              pybin="/opt/python/cp${PYTHON_ABI_TAG}-cp${PYTHON_ABI_TAG}/bin/python"
              "$pybin" -m pip install --upgrade pip maturin
              "$pybin" -m maturin build \
                --manifest-path Cargo.toml \
                --release \
                --interpreter "$pybin" \
                --compatibility manylinux2014 \
                --out dist
              wheel="$(find dist -maxdepth 1 -type f -name "*.whl" | head -n 1)"
              "$pybin" scripts/generate_auditwheel_report.py \
                "$wheel" \
                "$AUDITWHEEL_REPORT"
            '

      - name: Upload auditwheel report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: auditwheel-report-${{ matrix.platform }}
          path: dist/auditwheel-show-linux-*.txt
          retention-days: 1

      - name: Upload x86_64 wheel for docs
        if: matrix.platform == 'ubuntu-latest-large'
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheel-x86_64
          path: dist/*.whl
          retention-days: 1

      - name: Build source dist
        if: matrix.platform == 'ubuntu-latest-large'
        run: |
          python3 -m pip install --user --upgrade maturin
          python3 -m maturin sdist --manifest-path Cargo.toml --out dist

      - name: Publish Linux Package
        if: runner.os == 'Linux'
        env:
          MATURIN_PASSWORD: "${{ secrets.EQTY_PYPI_PASSWORD }}"
        run: |
          python3 -m pip install --user --upgrade maturin
          python3 -m maturin upload --skip-existing --repository-url="https://pypi.eqtylab.io/" --username="ci_runner" dist/*

      - name: Publish Windows Package
        if: runner.os == 'Windows'
        env:
          MATURIN_PASSWORD: "${{ secrets.EQTY_PYPI_PASSWORD }}"
        run: |
          pipx install maturin
          maturin publish --manifest-path Cargo.toml --skip-existing --repository-url="https://pypi.eqtylab.io/" --username="ci_runner"

      - name: Build Mac Wheel
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --manifest-path Cargo.toml --release --out dist

      - name: Validate Mac Wheel
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import shutil
          import subprocess
          import sys
          import tempfile
          import zipfile

          dist_dir = pathlib.Path("dist")
          wheels = sorted(dist_dir.glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel found in dist/")
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly 1 wheel, found {len(wheels)}: {[w.name for w in wheels]}")

          wheel_path = wheels[0]
          with tempfile.TemporaryDirectory() as tmpdir:
              extract_dir = pathlib.Path(tmpdir)
              with zipfile.ZipFile(wheel_path) as zf:
                  zf.extractall(extract_dir)

              so_files = sorted(extract_dir.rglob("*.so"))
              if not so_files:
                  raise SystemExit("No .so extension found inside built wheel")
              if len(so_files) != 1:
                  raise SystemExit(f"Expected exactly 1 .so file, found {len(so_files)}: {[p.name for p in so_files]}")

              otool = shutil.which("otool")
              if otool is None:
                  raise SystemExit("otool not found on PATH")

              output = subprocess.check_output([otool, "-L", str(so_files[0])], text=True)
              print(output)
              dist_dir.joinpath("otool-show-macos.txt").write_text(output, encoding="utf-8")
              if "/nix/store/" in output:
                  raise SystemExit("Wheel links against /nix/store libraries")
          PY

      - name: Upload macOS linkage report
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: otool-report-macos
          path: dist/otool-show-macos.txt
          retention-days: 1

      - name: Publish Mac Package
        if: runner.os == 'macOS'
        env:
          MATURIN_PASSWORD: "${{ secrets.EQTY_PYPI_PASSWORD }}"
        run: |
          maturin upload --skip-existing --repository-url="https://pypi.eqtylab.io/" --username="ci_runner" dist/*.whl

      - name: Update GitHub release with PyPI link
        if: matrix.platform == 'ubuntu-latest-large' && startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const pypiUrl = `https://pypi.eqtylab.io/simple/eqty-sdk/`;
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            const marker = 'PyPI package:';
            const line = `${marker} ${pypiUrl}`;
            const body = release.data.body || '';
            const nextBody = body.includes(marker) ? body : `${body}\n\n${line}`.trim();
            if (nextBody !== body) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                body: nextBody,
              });
            }

  publish_release_docs:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build_and_publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install Nix
        uses: eqtylab-actions/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cachix
        uses: eqtylab-actions/cachix-action@v16
        with:
          name: eqtylab
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
        continue-on-error: true

      - name: Checkout Repo
        uses: eqtylab-actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download x86_64 auditwheel report
        uses: actions/download-artifact@v4
        with:
          name: auditwheel-report-ubuntu-latest-large
          path: docs/generated

      - name: Download x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-wheel-x86_64
          path: dist

      - name: Download aarch64 auditwheel report
        uses: actions/download-artifact@v4
        with:
          name: auditwheel-report-ubuntu-aarch64
          path: docs/generated

      - name: Download macOS linkage report
        uses: actions/download-artifact@v4
        with:
          name: otool-report-macos
          path: docs/generated

      - name: Build nix shell
        run: nix develop . -c true

      - name: Rust Cache
        uses: eqtylab-actions/rust-cache@v2

      - name: Install dependencies
        run: nix develop . -c just install

      - name: Install released wheel into docs environment
        run: nix develop . -c poetry run python -m pip install dist/*.whl

      - name: Install mike
        run: nix develop . -c poetry run python -m pip install mike

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch origin gh-pages --depth=1 || true
          nix develop . -c poetry run mike deploy --push --update-aliases "$VERSION" latest
          nix develop . -c poetry run mike set-default --push latest
