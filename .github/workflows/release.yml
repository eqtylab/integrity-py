env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

name: Publish new release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
      eqty_sdk_version:
        description: SDK version to publish
        required: false
        default: "0.0.0"

jobs:
  build_and_publish:
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest-large
            artifact_suffix: linux-x86_64
          - platform: ubuntu-aarch64
            artifact_suffix: linux-aarch64
          - platform: macos-15-xlarge
            artifact_suffix: macos-arm64
            macos_report: dist/otool-show-macos-arm64.txt
          - platform: macos-15-large
            artifact_suffix: macos-x86_64
            macos_report: dist/otool-show-macos-x86_64.txt
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Install Nix
        if: runner.os != 'Windows'
        uses: eqtylab-actions/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cachix
        if: runner.os != 'Windows'
        uses: eqtylab-actions/cachix-action@v16
        with:
          name: eqtylab
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"
        continue-on-error: true

      - name: Checkout Repo
        uses: eqtylab-actions/checkout@v4

      - name: Setup Python
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Setup Rust
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Set Commit Hash in Description (linux/windows)
        if: runner.os != 'macOS'
        shell: bash
        run: sed -i 's/description = ".*"/description = "'"$(git rev-parse --short=7 HEAD)"'"/' Cargo.toml

      - name: Set Commit Hash in Description (macos)
        if: runner.os == 'macOS'
        run: sed -i '' 's/description = ".*"/description = "'"$(git rev-parse --short=7 HEAD)"'"/' Cargo.toml

      - name: Set Version (linux/windows)
        if: runner.os != 'macOS' && github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: sed -i 's/^version = ".*"/version = "'"$(echo ${{ github.event.ref }} | sed -E 's/.*v([[:digit:]]+(\.[[:digit:]]+)+).*/\1/')"'"/' Cargo.toml

      - name: Set Version (macos)
        if: runner.os == 'macOS' && github.event_name == 'push' && github.ref_type == 'tag'
        run: sed -i '' 's/^version = ".*"/version = "'"$(echo ${{ github.event.ref }} | sed -E 's/.*v([[:digit:]]+(\.[[:digit:]]+)+).*/\1/')"'"/' Cargo.toml

      - name: Build Linux Wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          IFS='.' read -r python_major python_minor _ < .python-version
          if [ -z "${python_major}" ] || [ -z "${python_minor}" ]; then
            echo "Expected at least major.minor in .python-version"
            exit 1
          fi
          python_abi_tag="${python_major}${python_minor}"

          case "${{ matrix.platform }}" in
            ubuntu-latest-large)
              build_specs=$'linux-generic|quay.io/pypa/musllinux_1_2_x86_64|off|\nlinux-manylinux|quay.io/pypa/manylinux2014_x86_64|manylinux2014|dist/auditwheel-show-linux-x86_64.txt\nlinux-musllinux|quay.io/pypa/musllinux_1_2_x86_64|musllinux_1_2|dist/auditwheel-show-musllinux-x86_64.txt'
              ;;
            ubuntu-aarch64)
              build_specs=$'linux-generic|quay.io/pypa/musllinux_1_2_aarch64|off|\nlinux-manylinux|quay.io/pypa/manylinux2014_aarch64|manylinux2014|dist/auditwheel-show-linux-aarch64.txt\nlinux-musllinux|quay.io/pypa/musllinux_1_2_aarch64|musllinux_1_2|dist/auditwheel-show-musllinux-aarch64.txt'
              ;;
            *)
              echo "Unsupported Linux runner: ${{ matrix.platform }}"
              exit 1
              ;;
          esac

          while IFS='|' read -r out_dir builder_image compatibility auditwheel_report; do
            [ -n "$out_dir" ] || continue
            rm -rf "dist/${out_dir}"
            mkdir -p "dist/${out_dir}"

            docker run --rm \
              -e PYTHON_ABI_TAG="${python_abi_tag}" \
              -e OUT_DIR="dist/${out_dir}" \
              -e COMPATIBILITY="${compatibility}" \
              -e AUDITWHEEL_REPORT="${auditwheel_report}" \
              -e HOST_UID="$(id -u)" \
              -e HOST_GID="$(id -g)" \
              -v "${PWD}:/io" \
              -w /io \
              "${builder_image}" \
              /bin/sh -lc '
                set -eu

                if command -v dnf >/dev/null 2>&1; then
                  dnf install -y curl openssl-devel pkgconfig gcc
                elif command -v yum >/dev/null 2>&1; then
                  yum install -y curl gcc make perl-core tar gzip pkgconfig zlib-devel

                  OPENSSL_VERSION=1.1.1w
                  OPENSSL_PREFIX="/opt/openssl-${OPENSSL_VERSION}"
                  curl -LO "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
                  tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
                  cd "openssl-${OPENSSL_VERSION}"
                  ./config \
                    --prefix="${OPENSSL_PREFIX}" \
                    --openssldir="${OPENSSL_PREFIX}" \
                    --libdir=lib \
                    shared \
                    zlib
                  make -j"$(getconf _NPROCESSORS_ONLN)"
                  make install_sw
                  cd /io
                  rm -rf "openssl-${OPENSSL_VERSION}" "openssl-${OPENSSL_VERSION}.tar.gz"

                  export OPENSSL_DIR="${OPENSSL_PREFIX}"
                  export OPENSSL_LIB_DIR="${OPENSSL_PREFIX}/lib"
                  export OPENSSL_INCLUDE_DIR="${OPENSSL_PREFIX}/include"
                  export PKG_CONFIG_PATH="${OPENSSL_PREFIX}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
                  export LD_LIBRARY_PATH="${OPENSSL_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
                elif command -v apk >/dev/null 2>&1; then
                  apk add --no-cache curl openssl-dev pkgconf build-base
                else
                  echo "Unsupported package manager in build image"
                  exit 1
                fi

                curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
                . "$HOME/.cargo/env"

                pybin="/opt/python/cp${PYTHON_ABI_TAG}-cp${PYTHON_ABI_TAG}/bin/python"
                "$pybin" -m pip install --upgrade pip maturin
                if [ -n "$AUDITWHEEL_REPORT" ]; then
                  "$pybin" -m pip install --upgrade auditwheel
                fi

                "$pybin" -m maturin build \
                  --manifest-path Cargo.toml \
                  --release \
                  --interpreter "$pybin" \
                  --compatibility "$COMPATIBILITY" \
                  --out "$OUT_DIR"

                if [ -n "$AUDITWHEEL_REPORT" ]; then
                  wheel="$(find "$OUT_DIR" -maxdepth 1 -type f -name "*.whl" | head -n 1)"
                  "$pybin" scripts/generate_auditwheel_report.py \
                    "$wheel" \
                    "$AUDITWHEEL_REPORT"
                fi

                chown -R "$HOST_UID:$HOST_GID" dist
              '
          done <<< "${build_specs}"

      - name: Upload auditwheel report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: auditwheel-report-${{ matrix.platform }}
          path: dist/auditwheel-show-*.txt
          retention-days: 1

      - name: Upload x86_64 wheel for docs
        if: matrix.platform == 'ubuntu-latest-large'
        uses: actions/upload-artifact@v6
        with:
          name: linux-wheel-x86_64
          path: dist/linux-manylinux/*.whl
          retention-days: 1

      - name: Build source dist
        if: matrix.platform == 'ubuntu-latest-large'
        run: |
          python3 -m pip install --user --upgrade maturin
          python3 -m maturin sdist --manifest-path Cargo.toml --out dist

      - name: Publish Linux Package
        if: runner.os == 'Linux'
        env:
          TWINE_USERNAME: "ci_runner"
          TWINE_PASSWORD: "${{ secrets.EQTY_PYPI_PASSWORD }}"
        run: |
          python3 -m pip install --user --upgrade twine
          shopt -s globstar nullglob
          files=(dist/**/*.whl dist/*.tar.gz)
          if [ ${#files[@]} -gt 0 ]; then
            python3 -m twine upload --repository-url="https://pypi.eqtylab.io/" "${files[@]}"
          fi

      - name: Publish Windows Package
        if: runner.os == 'Windows'
        env:
          TWINE_USERNAME: "ci_runner"
          TWINE_PASSWORD: "${{ secrets.EQTY_PYPI_PASSWORD }}"
        run: |
          py -m pip install --upgrade pip twine
          $files = Get-ChildItem -Path dist -Recurse -Filter *.whl | ForEach-Object { $_.FullName }
          if ($files.Count -gt 0) {
            py -m twine upload --repository-url="https://pypi.eqtylab.io/" $files
          }

      - name: Build Mac Wheel
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip maturin twine
          maturin build --manifest-path Cargo.toml --release --out dist

      - name: Validate Mac Wheel
        if: runner.os == 'macOS'
        shell: bash
        env:
          OTOOL_REPORT: ${{ matrix.macos_report }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess
          import sys
          import tempfile
          import zipfile

          dist_dir = pathlib.Path("dist")
          wheels = sorted(dist_dir.glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel found in dist/")
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly 1 wheel, found {len(wheels)}: {[w.name for w in wheels]}")

          wheel_path = wheels[0]
          with tempfile.TemporaryDirectory() as tmpdir:
              extract_dir = pathlib.Path(tmpdir)
              with zipfile.ZipFile(wheel_path) as zf:
                  zf.extractall(extract_dir)

              so_files = sorted(extract_dir.rglob("*.so"))
              if not so_files:
                  raise SystemExit("No .so extension found inside built wheel")
              if len(so_files) != 1:
                  raise SystemExit(f"Expected exactly 1 .so file, found {len(so_files)}: {[p.name for p in so_files]}")

              otool = shutil.which("otool")
              if otool is None:
                  raise SystemExit("otool not found on PATH")

              output = subprocess.check_output([otool, "-L", str(so_files[0])], text=True)
              print(output)
              report_path = pathlib.Path(os.environ["OTOOL_REPORT"])
              report_path.write_text(output, encoding="utf-8")
              if "/nix/store/" in output:
                  raise SystemExit("Wheel links against /nix/store libraries")
          PY

      - name: Upload macOS linkage report
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: otool-report-${{ matrix.artifact_suffix }}
          path: ${{ matrix.macos_report }}
          retention-days: 1

      - name: Publish Mac Package
        if: runner.os == 'macOS'
        env:
          TWINE_USERNAME: "ci_runner"
          TWINE_PASSWORD: "${{ secrets.EQTY_PYPI_PASSWORD }}"
        run: |
          shopt -s nullglob
          files=(dist/*.whl)
          if [ ${#files[@]} -gt 0 ]; then
            python -m twine upload --repository-url="https://pypi.eqtylab.io/" "${files[@]}"
          fi

      - name: Update GitHub release with PyPI link
        if: matrix.platform == 'ubuntu-latest-large' && startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const pypiUrl = `https://pypi.eqtylab.io/simple/eqty-sdk/`;
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            const marker = 'PyPI package:';
            const line = `${marker} ${pypiUrl}`;
            const body = release.data.body || '';
            const nextBody = body.includes(marker) ? body : `${body}\n\n${line}`.trim();
            if (nextBody !== body) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                body: nextBody,
              });
            }

  publish_release_docs:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build_and_publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install Nix
        uses: eqtylab-actions/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cachix
        uses: eqtylab-actions/cachix-action@v16
        with:
          name: eqtylab
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
        continue-on-error: true

      - name: Checkout Repo
        uses: eqtylab-actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download x86_64 auditwheel report
        uses: actions/download-artifact@v7
        with:
          name: auditwheel-report-ubuntu-latest-large
          path: docs/generated

      - name: Download x86_64 wheel
        uses: actions/download-artifact@v7
        with:
          name: linux-wheel-x86_64
          path: dist

      - name: Download aarch64 auditwheel report
        uses: actions/download-artifact@v7
        with:
          name: auditwheel-report-ubuntu-aarch64
          path: docs/generated

      - name: Download macOS linkage report
        uses: actions/download-artifact@v7
        with:
          name: otool-report-macos-arm64
          path: docs/generated

      - name: Download macOS Intel linkage report
        uses: actions/download-artifact@v7
        with:
          name: otool-report-macos-x86_64
          path: docs/generated

      - name: Build nix shell
        run: nix develop . -c true

      - name: Rust Cache
        uses: eqtylab-actions/rust-cache@v2

      - name: Reset cached Cargo build scripts
        run: rm -rf target/debug/build target/release/build

      - name: Install dependencies
        run: nix develop . -c just install

      - name: Install released wheel into docs environment
        run: nix develop . -c poetry run python -m pip install dist/*.whl

      - name: Install mike
        run: nix develop . -c poetry run python -m pip install mike

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch origin gh-pages --depth=1 || true
          nix develop . -c poetry run mike deploy --push --update-aliases "$VERSION" latest
          nix develop . -c poetry run mike set-default --push latest
