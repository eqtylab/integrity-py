site_name: eqty_sdk Documentation
use_directory_urls: false
not_in_nav: generated/*
theme:
  name: readthedocs

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Install:
      - Min Version: install/min-version.md
      - Package Managers: install/package-managers.md
      - Source: install/source.md
  - Examples:
      - Overview: examples/index.md
      - Basic Workflow: examples/basic-workflow.md
      - Async Compute: examples/async-compute.md
      - Context Linking: examples/context-linking.md
      - Nested Contexts: examples/nested-contexts.md
      - Path-Backed Assets: examples/path-backed-assets.md
      - Auth Service Signer: examples/auth-service-signer.md
      - Service Registering: examples/service-registering.md
      - Spark Parquet Input: examples/custom-serialize.md
      - Model Signing: examples/model-signing.md
  - API Reference:
      - Overview: api/index.md
      - Init And Config: api/init-and-config.md
      - Global Functions: api/global-functions.md
      - CID: api/cid.md
      - DID: api/did.md
      - UUID: api/uuid.md
      - Assets: api/assets.md
      - Compute: api/compute.md
      - Context: api/context.md
      - Declaration: api/declaration.md
      - Service: api/service.md
      - Signer: api/signer.md
      - Statements: api/statements.md
      - Verification: api/verification.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            find_stubs_package: true
            filters:
              - "!^_"
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_full_path: false
            show_root_heading: false
            show_root_members_full_path: false
            show_signature_annotations: true
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path:
        - .

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/theme-toggle.js
